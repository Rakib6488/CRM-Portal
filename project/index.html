<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Admin Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Segoe UI, Tahoma, Arial, sans-serif; background: #eef2f6; color: #172033; }
    .shell { width: min(920px, calc(100% - 28px)); margin: 24px auto; background: #fff; border: 1px solid #d8e0ea; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12); }
    .header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px 18px; border-bottom: 1px solid #d8e0ea; background: #f8fafc; }
    h1 { font-size: 18px; margin: 0; }
    .status { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 6px; background: #fff3cd; color: #7a5700; white-space: nowrap; }
    .status.connected { background: #d1fae5; color: #065f46; }
    .status.disconnected { background: #fee2e2; color: #991b1b; }
    .content { display: grid; grid-template-columns: 220px 1fr; min-height: 560px; }
    .sidebar { border-right: 1px solid #d8e0ea; background: #f8fafc; padding: 14px; }
    .label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 10px; }
    .profile { padding: 12px; border: 1px solid #d8e0ea; border-radius: 8px; background: #fff; }
    .profile strong { display: block; font-size: 14px; margin-bottom: 6px; word-break: break-word; }
    .profile span { display: block; font-size: 13px; color: #475569; word-break: break-word; }
    .chat { display: flex; flex-direction: column; min-width: 0; }
    .messages { flex: 1; padding: 18px; overflow-y: auto; background: #f6f7f9; }
    .empty { color: #64748b; text-align: center; margin-top: 140px; }
    .message { max-width: 76%; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; line-height: 1.4; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }
    .incoming { background: #fff; border: 1px solid #e2e8f0; }
    .outgoing { margin-left: auto; background: #dbeafe; border: 1px solid #bfdbfe; }
    .message-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .message-text { white-space: pre-wrap; word-break: break-word; }
    .composer { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; padding: 14px; border-top: 1px solid #d8e0ea; background: #fff; }
    input { min-width: 0; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { padding: 11px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    @media (max-width: 720px) { .content { grid-template-columns: 1fr; } .sidebar { border-right: 0; border-bottom: 1px solid #d8e0ea; } .composer { grid-template-columns: 1fr; } .message { max-width: 92%; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><h1>Telegram Live Chat Dashboard</h1><div id="status" class="status disconnected">Connecting...</div></header>
    <section class="content">
      <aside class="sidebar"><div class="label">Selected User</div><div class="profile"><strong id="profileName">No user selected</strong><span id="profileUsername"></span><span id="profileId">Waiting for a message</span></div></aside>
      <section class="chat"><div id="messages" class="messages"><div id="emptyState" class="empty">Incoming Telegram messages will appear here.</div></div><div class="composer"><input type="text" id="userId" placeholder="User ID" readonly><input type="text" id="replyText" placeholder="Type a reply..." autocomplete="off"><button id="sendButton" type="button">Send</button></div></section>
    </section>
  </main>
  <script>
    const socket = io();
    const statusDiv = document.getElementById("status");
    const messagesDiv = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");
    const userIdInput = document.getElementById("userId");
    const replyTextInput = document.getElementById("replyText");
    const sendButton = document.getElementById("sendButton");
    const profileName = document.getElementById("profileName");
    const profileUsername = document.getElementById("profileUsername");
    const profileId = document.getElementById("profileId");
    function setStatus(text, className) { statusDiv.textContent = text; statusDiv.className = `status ${className || ""}`.trim(); }
    function appendMessage({ name, text, type }) { emptyState?.remove(); const wrapper = document.createElement("div"); wrapper.className = `message ${type}`; const sender = document.createElement("div"); sender.className = "message-name"; sender.textContent = name; const body = document.createElement("div"); body.className = "message-text"; body.textContent = text; wrapper.append(sender, body); messagesDiv.appendChild(wrapper); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
    function sendReply() { const senderId = userIdInput.value.trim(); const text = replyTextInput.value.trim(); if (!senderId || !text) return; socket.emit("send-reply", { senderId, text }); appendMessage({ name: "You", text, type: "outgoing" }); replyTextInput.value = ""; replyTextInput.focus(); }
    socket.on("connect", () => setStatus("Connected", "connected"));
    socket.on("disconnect", () => setStatus("Disconnected. Reconnecting...", "disconnected"));
    socket.on("server-status", (data) => { if (data && data.telegramReady === false) setStatus("Server connected, Telegram not ready", ""); });
    socket.on("telegram-message", (data) => { const displayName = data.name || "Telegram User"; const username = data.username ? `@${data.username}` : ""; userIdInput.value = data.senderId || ""; profileName.textContent = displayName; profileUsername.textContent = username; profileId.textContent = data.senderId ? `ID: ${data.senderId}` : "No ID"; appendMessage({ name: username ? `${displayName} (${username})` : displayName, text: data.text || "", type: "incoming" }); });
    socket.on("reply-error", (message) => setStatus(message || "Reply failed", "disconnected"));
    socket.on("reply-sent", () => setStatus("Reply sent", "connected"));
    sendButton.addEventListener("click", sendReply);
    replyTextInput.addEventListener("keydown", (event) => { if (event.key === "Enter") sendReply(); });
  </script>
</body>
</html>
